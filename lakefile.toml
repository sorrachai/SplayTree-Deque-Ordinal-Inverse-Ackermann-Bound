name = "splay-deque-challenge"
version = "0.1.0"
defaultTargets = ["ChallengeMain", "ChallengeHelpers", "SolutionMain", "SolutionHelpers", "ChallengeStandalone", "CheckStandalone"]

[[require]]
name = "AlgoLib"
git = "https://github.com/cslib-community/AlgoLib"
rev = "v4.35.0"

[[lean_lib]]
name = "Challenge"
globs = ["Challenge.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ChallengeMain"
globs = ["ChallengeMain"]
requiresModuleSystem = true

[[lean_lib]]
name = "ChallengeHelpers"
globs = ["ChallengeHelpers"]
requiresModuleSystem = true

[[lean_lib]]
name = "Solution"
globs = ["Solution.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "SolutionMain"
globs = ["SolutionMain"]
requiresModuleSystem = true

[[lean_lib]]
name = "SolutionHelpers"
globs = ["SolutionHelpers"]
requiresModuleSystem = true

[[lean_lib]]
name = "ChallengeStandalone"
globs = ["ChallengeStandalone"]
allowNonModules = true

[[lean_lib]]
name = "CheckStandalone"
globs = ["CheckStandalone"]
allowNonModules = true
